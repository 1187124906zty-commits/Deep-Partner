[package]
name = "deep-partner-desktop"
version = "0.4.2"
description = "Deep partner native desktop client"
edition = "2024"
license = "MIT"
default-run = "deep-partner"

[[bin]]
name = "deep-partner"
path = "src/main.rs"
required-features = ["desktop-web"]

[[bin]]
name = "dp"
path = "src/bin/dp.rs"

[[bin]]
name = "deep-partner-legacy"
path = "src/bin/legacy.rs"
required-features = ["legacy-egui"]

[features]
default = []
desktop-web = ["dep:tauri", "dep:tauri-build", "dep:rust-embed", "dep:mime_guess"]
legacy-egui = ["dep:eframe", "dep:egui", "dep:egui_extras", "dep:egui_commonmark", "dep:wgpu"]

[lib]
name = "deeptutor_desktop"
path = "src/lib.rs"

[dependencies]
eframe = { version = "=0.37.0", optional = true, default-features = false, features = ["default_fonts", "accesskit", "wgpu_no_default_features", "clipboard", "links"] }
egui = { version = "=0.37.0", optional = true }
egui_extras = { version = "0.37", optional = true, features = ["image", "svg"] }
egui_commonmark = { version = "0.26", optional = true, default-features = false, features = ["pulldown_cmark"] }
wgpu = { version = "30", optional = true, default-features = false, features = ["std", "dx12"] }
tauri = { version = "=2.12.3", optional = true }
rust-embed = { version = "8.13", optional = true, features = ["debug-embed"] }
mime_guess = { version = "2", optional = true }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
axum = { version = "0.8", features = ["ws"] }
base64 = "0.22"
futures-util = "0.3"
hyper-util = { version = "=0.1.21", features = ["client-proxy-system"] }
image = { version = "0.25", default-features = false, features = ["png"] }
open = "5"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "multipart", "stream", "gzip", "http2", "system-proxy"] }
rfd = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.39"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "process", "time", "sync", "io-util", "fs"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
url = "2"
uuid = { version = "1", features = ["v4"] }
walkdir = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_Threading", "Win32_System_Console", "Win32_Security_Cryptography", "Win32_System_Memory"] }

[build-dependencies]
winresource = "0.1"
tauri-build = { version = "2.7", optional = true }

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 8
strip = true
