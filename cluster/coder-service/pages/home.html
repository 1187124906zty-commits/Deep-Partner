<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DeepTutor · 科研工作台</title><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#141817;color:#eef2ef;font:15px system-ui,sans-serif;height:100vh;display:flex;flex-direction:column}header{display:flex;align-items:center;gap:18px;padding:12px 22px;border-bottom:1px solid #3b453e;background:#1d2520}strong{font-size:17px;margin-right:10px}button{font:inherit;color:#d4dfd7;background:transparent;border:1px solid transparent;border-radius:8px;padding:8px 17px;cursor:pointer}button.active{background:#efb18b;color:#1b281f}a{font-size:13px;color:#c9d6cd;text-decoration:none}.spacer{flex:1}iframe{border:0;flex:1;width:100%;background:#141817}#account{color:#9eafa5;font-size:13px}@media(max-width:650px){header{flex-wrap:wrap;gap:7px;padding:10px}.spacer{display:none}strong{width:100%}}</style><header><strong>科研工作台</strong><button class="active" data-mode="tutor">DeepTutor</button><button data-mode="coder">Coder</button><span class="spacer"></span><span id="account"></span><a href="/access/review" target="_blank" rel="noopener">注册管理</a><a href="/access/quick-login">设备登录</a></header><iframe id="surface" title="DeepTutor 工作区"></iframe><script>
const frame=document.querySelector('#surface');let initial=new URLSearchParams(location.search).get('chat')||'/chat';if(!initial.startsWith('/chat'))initial='/chat';const urls={tutor:initial,coder:'/access/coder'};const frames={};
document.querySelectorAll('button[data-mode]').forEach(b=>b.onclick=()=>{document.querySelectorAll('button[data-mode]').forEach(x=>x.classList.toggle('active',x===b));const mode=b.dataset.mode;document.querySelectorAll('iframe').forEach(x=>x.style.display='none');if(!frames[mode]){let f=document.createElement('iframe');f.title=mode==='coder'?'DeepCode 编码工作区':'DeepTutor 学习工作区';f.src=urls[mode];document.body.append(f);frames[mode]=f}frames[mode].style.display='block'});
(async()=>{let r=await fetch('/api/auth/status'),d=await r.json();if(!d.authenticated){location.href='/access/quick-login?next='+encodeURIComponent('/access/home');return}document.querySelector('#account').textContent=d.username;frame.src=urls.tutor;frames.tutor=frame;if(!d.is_admin){document.querySelector('button[data-mode="coder"]').hidden=true;document.querySelector('a[href="/access/review"]').hidden=true}})();
</script></html>
