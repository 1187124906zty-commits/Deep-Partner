<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DeepTutor · 快捷登录</title><style>:root{color-scheme:dark}body{margin:0;background:#161c18;color:#eef2ef;font:16px/1.7 system-ui,sans-serif}main{max-width:550px;margin:9vh auto;padding:32px;border:1px solid #3d4b41;border-radius:18px;background:#202922}h1{font-size:27px;margin:8px 0}a{color:#efb28e}p{color:#c2cec6}label{display:block;margin:16px 0 8px}input{font:inherit;padding:11px;width:100%;box-sizing:border-box;background:#141c16;border:1px solid #5c6b60;border-radius:8px;color:#fff}button{font:inherit;border:0;border-radius:8px;background:#f0b18a;color:#18261c;padding:11px 18px;margin:14px 6px 0 0;cursor:pointer}button:disabled{opacity:.5}.small{font-size:13px;color:#a7b9ac}#code{font:28px ui-monospace,monospace;letter-spacing:4px;color:#f8c4a4}#status{white-space:pre-wrap}details{border-top:1px solid #455449;margin-top:22px;padding-top:12px}.device{margin:12px 0;border-top:1px solid #455449;padding-top:12px}@media(max-width:600px){main{margin:24px 16px;padding:24px}}</style><main><p class="small">DeepTutor · 统一工作台</p><h1>快捷登录</h1><p id="status" role="status">正在核验此浏览器的设备凭证…</p><div id="actions" hidden><label for="name">设备名称</label><input id="name" maxlength="80" value="我的电脑" autocomplete="off"><button id="pair">请 GG 授权此设备</button><button id="remember" hidden>记住当前已登录设备</button><p class="small">首次需你在微信确认；授权后，这个浏览器可在30天内免输密码。凭证保存在此浏览器中，不读取电脑硬件序列号。</p></div><div id="code"></div><p><a id="password" href="/login">使用账号密码登录</a> · <a href="/access/request">申请账号</a></p><details id="management" hidden><summary>管理已授权设备</summary><div id="devices"></div></details></main><script>
const $=s=>document.querySelector(s);let timer;let next=new URLSearchParams(location.search).get('next')||'/access/home';if(!next.startsWith('/')||next.startsWith('//')||next.startsWith('/access/quick-login'))next='/access/home';$('#password').href='/login?next='+encodeURIComponent('/access/quick-login?next='+encodeURIComponent(next));
async function post(path,body){let r=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body||{})});let d=await r.json();if(!r.ok)throw Error(d.detail||'请求失败');return d}
async function manage(){let r=await fetch('/api/quick-login/devices');if(!r.ok)return;let d=await r.json();$('#management').hidden=false;$('#devices').replaceChildren();for(let v of d.devices){if(v.revoked_at)continue;let div=document.createElement('div');div.className='device';let t=document.createElement('p');t.textContent=v.name+' · '+v.user_agent.slice(0,90);let b=document.createElement('button');b.textContent='撤销授权';b.onclick=async()=>{await post('/api/quick-login/devices/'+v.id+'/revoke');await manage()};div.append(t,b);$('#devices').append(div)}}
async function poll(){try{let r=await fetch('/api/quick-login/status');let d=await r.json();if(!r.ok)throw Error(d.detail);if(d.status==='approved'){await post('/api/quick-login/complete');$('#status').textContent='设备已授权，正在进入工作台…';location.href=next;return}if(d.status==='rejected'){$('#status').textContent='这次设备授权未获同意。你仍可使用账号密码登录。';return}$('#status').textContent='请在微信向 GG 确认这台设备。核对页面与消息中的代码一致。';timer=setTimeout(poll,2500)}catch(e){$('#status').textContent=e.message;$('#pair').disabled=false}}
$('#pair').onclick=async()=>{$('#pair').disabled=true;try{let d=await post('/api/quick-login/request',{name:$('#name').value});$('#code').textContent=d.display_code;await poll()}catch(e){$('#status').textContent=e.message;$('#pair').disabled=false}};
$('#remember').onclick=async()=>{try{await post('/api/quick-login/remember',{name:$('#name').value});$('#status').textContent='已记住此设备。';location.href=next}catch(e){$('#status').textContent=e.message}};
(async()=>{let r=await fetch('/api/auth/status'),s=await r.json();if(s.authenticated&&s.is_admin){$('#status').textContent='你已登录。可记住此设备，供下次免输密码使用。';$('#actions').hidden=false;$('#pair').hidden=true;$('#remember').hidden=false;let a=document.createElement('a');a.href=next;a.textContent='直接进入工作台';$('#status').append(document.createElement('br'),a);await manage();return}try{await post('/api/quick-login/login');$('#status').textContent='设备核验通过，正在登录…';location.href=next}catch{$('#status').textContent='此浏览器尚未获得免密授权。请通过微信确认，或先使用密码登录。';$('#actions').hidden=false}})();
</script></html>
