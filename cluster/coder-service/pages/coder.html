<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DeepTutor · Coder</title>
<style>
:root{color-scheme:dark;--bg:#141817;--panel:#202624;--line:#39413d;--accent:#f1ad87}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#eef2ef;font:15px/1.6 system-ui,sans-serif}header{padding:22px 32px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:20px}h1{font-size:23px;margin:0}p{margin:7px 0;color:#c5cec8}a{color:var(--accent)}main{max-width:1240px;margin:28px auto;padding:0 24px;display:grid;grid-template-columns:340px 1fr;gap:24px}section{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px}h2{font-size:17px;margin:0 0 12px}label{display:block;margin:12px 0 6px}input,textarea,select{font:inherit;color:inherit;background:#121815;border:1px solid #4b5750;border-radius:8px;padding:10px;width:100%}textarea{resize:vertical}button{font:inherit;background:var(--accent);color:#172019;border:0;border-radius:8px;padding:10px 18px;cursor:pointer}button:disabled{opacity:.5}.source{padding:10px 0;border-top:1px solid var(--line);display:flex;align-items:flex-start;gap:9px}.source input{width:auto;margin-top:7px}.source small{display:block;color:#9eafa5}.sources{max-height:520px;overflow:auto}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#131916;padding:18px;border-radius:9px;font:14px/1.65 ui-monospace,monospace;min-height:80px}.muted{color:#9eafa5;font-size:13px}.row{display:flex;gap:12px;align-items:end}.row>div{flex:1}.pill{border:1px solid #5b6a61;border-radius:99px;padding:3px 12px;font-size:12px}.task{display:block;padding:9px 0;border-top:1px solid var(--line)}.error{color:#ffb6a8}details{margin-top:12px}#msg{white-space:pre-wrap;margin-top:14px}@media(max-width:800px){main{grid-template-columns:1fr}header{padding:18px 24px}.sources{max-height:250px}}
</style>
<header><div><h1>Coder</h1><p>选取学习与研究会话，让 DeepCode 规划、实现和验证。</p></div><div><span class="pill" id="engine">连接中</span> <a href="/access/home" target="_top">统一工作台</a></div></header>
<main><aside><section><h2>带入哪些会话</h2><p class="muted">来自当前管理员账户的各工作区。选择后会生成可回查的上下文快照。</p><div id="sources" class="sources">读取中…</div></section><section style="margin-top:20px"><h2>最近任务</h2><div id="tasks"></div></section></aside>
<div><section><h2>新任务</h2><form id="run"><div class="row"><div><label for="project">项目名称</label><input id="project" value="research" pattern="[a-zA-Z0-9_-]{1,60}" required></div><div><label for="mode">执行方式</label><select id="mode"><option value="plan">规划 · 只读</option><option value="code">编码 · 修改并验证</option></select></div></div><label for="task">任务说明</label><textarea id="task" rows="6" placeholder="例如：根据第一课的讨论，规划氯—硫酸盐传输算子的数据结构、求解器与验证算例。" required></textarea><label for="resume">继续哪个任务（可选）</label><input id="resume" placeholder="留空开始新任务；填任务编号可继续同一项目"><p class="muted">DeepCode 独立容器执行。大规模求解、训练与后处理使用集群 Slurm；本页关闭后任务仍会继续。</p><button id="submit">启动任务</button></form><div id="msg" role="status"></div></section>
<section style="margin-top:20px"><h2>任务结果 <span id="status" class="pill">未选择</span></h2><p class="muted" id="identity"></p><pre id="answer">选择最近任务，或启动一次规划。</pre><details><summary>实时活动</summary><pre id="events"></pre></details><h2 style="margin-top:22px">项目文件</h2><div id="files" class="muted">任务完成后可在这里下载文件。</div></section></div></main>
<script>
const $=s=>document.querySelector(s);let timer=null,selected='',offset=0,knownProject='research';
async function api(url,opt){let r=await fetch(url,opt);if(r.status===401){location.href='/login?next='+encodeURIComponent('/access/coder');throw Error('请先登录')}let d=await r.json();if(!r.ok)throw Error(typeof d.detail==='string'?d.detail:'请求失败');return d}
async function init(){try{let h=await api('/api/coder/health');$('#engine').textContent=h.engine+' '+h.version+' · max';let d=await api('/api/coder/sessions');$('#sources').replaceChildren();for(let s of d.sessions){let l=document.createElement('label');l.className='source';let c=document.createElement('input');c.type='checkbox';c.dataset.source=JSON.stringify({workspace_id:s.workspace_id,session_id:s.session_id});let text=document.createElement('span');text.textContent=s.title;let meta=document.createElement('small');meta.textContent=(s.workspace||'默认工作区')+' · '+s.capability;text.append(meta);l.append(c,text);$('#sources').append(l)}if(!d.sessions.length)$('#sources').textContent='当前账户暂无可用会话。';await listTasks();let tid=new URLSearchParams(location.search).get('task');if(tid)watch(tid)}catch(e){$('#msg').textContent=e.message;$('#msg').className='error'}}
async function listTasks(){let d=await api('/api/coder/tasks');$('#tasks').replaceChildren();for(let t of d.tasks){let a=document.createElement('a');a.className='task';a.href='?task='+t.id;a.textContent=t.project+' · '+t.mode+' · '+t.status;a.onclick=e=>{e.preventDefault();history.replaceState(null,'','?task='+t.id);watch(t.id)};$('#tasks').append(a)}}
function eventText(e){let m=e.msg||e;return (m.type||'event')+(m.text?'\n'+m.text:m.message?'\n'+m.message:m.tool_name?' '+m.tool_name:'')}
async function files(project){let d=await api('/api/coder/projects/'+encodeURIComponent(project)+'/files');$('#files').replaceChildren();for(let f of d.files){let p=document.createElement('p'),a=document.createElement('a');a.textContent=f.path+' ('+f.size+' bytes)';a.href='/api/coder/projects/'+encodeURIComponent(project)+'/files?path='+encodeURIComponent(f.path);p.append(a);$('#files').append(p)}if(!d.files.length)$('#files').textContent='暂无项目产物。'}
async function watch(tid){clearTimeout(timer);if(selected!==tid){selected=tid;offset=0;$('#events').textContent='';$('#answer').textContent='等待任务结果…'}try{let d=await api('/api/coder/tasks/'+tid+'?offset='+offset);offset=d.next_offset;knownProject=d.project;$('#status').textContent=d.status;$('#identity').textContent='任务 '+d.id+' · 项目 '+d.project+(d.session_id?' · DeepCode 会话 '+d.session_id:'');if(d.result)$('#answer').textContent=d.result;else if(d.error)$('#answer').textContent=d.error;for(let e of d.events)$('#events').textContent+=eventText(e)+'\n';if(['queued','running'].includes(d.status))timer=setTimeout(()=>watch(tid),2000);else{await files(d.project);await listTasks()}}catch(e){$('#msg').textContent=e.message}}
$('#run').onsubmit=async e=>{e.preventDefault();$('#submit').disabled=true;$('#msg').textContent='正在提交…';try{let sources=[...document.querySelectorAll('input[data-source]:checked')].map(x=>JSON.parse(x.dataset.source));let d=await api('/api/coder/tasks',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({project:$('#project').value,mode:$('#mode').value,task:$('#task').value,sources,resume_id:$('#resume').value.trim()})});$('#msg').textContent='任务已进入队列。';history.replaceState(null,'','?task='+d.id);await listTasks();await watch(d.id)}catch(e){$('#msg').textContent=e.message}finally{$('#submit').disabled=false}};init();
</script></html>
